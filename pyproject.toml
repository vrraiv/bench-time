[project]
name = "courtdelay"
version = "0.1.0"
description = "Court Delay Observatory: reproducible pipeline measuring court delay in Ontario and the federal courts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "pyarrow>=17",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "lxml>=5",
]

[project.scripts]
courtdelay = "courtdelay.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/courtdelay"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
