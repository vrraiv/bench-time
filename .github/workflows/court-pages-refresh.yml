# Manual fallback only since 2026-11-23 (owner decision): the Sunday refresh on the owner's
# machine now rebuilds the open-data tables weekly and opens the pull request
# (scripts/weekly_refresh.ps1). The schedule was removed; run this from the Actions tab
# ("Run workflow") when that machine is off for a while.
#
# Quarterly refresh of the statistics pages the courts publish themselves (owner decision
# 2026-11-20): Supreme Court statistics (S5), Ontario Court of Justice criminal statistics (S7),
# Federal Court and Federal Court of Appeal activity summaries (S8), federal judicial vacancies
# (S9, read through the Wayback Machine).
#
# Timing: late in the second month after each quarter ends. The Federal Court of Appeal posted
# its third-quarter 2026 figures in mid-November, so earlier runs would miss the newest quarter.
#
# Not covered (done by hand on the owner's machine): the Court of Appeal for Ontario annual
# report (a new PDF at a new address each year) and the Tax Court workload table.
#
# Each source is fetched in its own step. If one fails (a court moved a page, the archive is
# down), the others still run and its tables are left exactly as committed; the run is then
# marked failed at the end so the failure is seen. Nothing is committed to main: when a
# published table's data has changed, the workflow opens a pull request for review.
#
# The pull request also carries site/src/data/source_vintage.json, the fetch date of the data
# behind the tables. A local build whose copy of a source is older than that date leaves the
# source's tables alone and says so; the weekly refresh on the owner's machine re-requests these
# pages, or run  uv run courtdelay fetch s8 --refresh  (likewise s5, s7, s9) to catch up at once.
name: Court statistics pages refresh

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: court-pages-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --frozen
      - name: Supreme Court statistics (S5)
        id: s5
        continue-on-error: true
        run: uv run courtdelay fetch s5
      - name: Ontario Court of Justice statistics (S7)
        id: s7
        continue-on-error: true
        run: uv run courtdelay fetch s7
      - name: Federal Court and Federal Court of Appeal summaries (S8)
        id: s8
        continue-on-error: true
        run: uv run courtdelay fetch s8
      - name: Federal judicial vacancies (S9)
        id: s9
        continue-on-error: true
        run: uv run courtdelay fetch s9
      - name: Build tables
        run: uv run courtdelay build
      - name: Find tables whose data changed
        id: changed
        run: |
          uv run python scripts/tables_changed.py > changed.txt
          cat changed.txt
          if [ -s changed.txt ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - name: Open a pull request
        if: steps.changed.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOMES: "S5 ${{ steps.s5.outcome }}, S7 ${{ steps.s7.outcome }}, S8 ${{ steps.s8.outcome }}, S9 ${{ steps.s9.outcome }}"
        run: |
          branch="court-pages-refresh-$(date -u +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          xargs -d '\n' git add -- < changed.txt
          git add -- site/src/data/source_vintage.json
          git commit -m "Court statistics pages: refresh $(date -u +%Y-%m)"
          git push --force origin "$branch"
          {
            echo "Refresh of the statistics pages the courts publish. Tables whose data changed:"
            echo
            sed 's/^/- /' changed.txt
            echo
            echo "Fetch results: $OUTCOMES. Tables of a source that failed are unchanged."
            echo
            echo "After merging, local builds leave these tables alone until the local copy of the source has caught up: the weekly refresh does that, or run \`uv run courtdelay fetch <source> --refresh\`."
          } > body.md
          gh pr create --base main --head "$branch" \
            --title "Court statistics pages: $(date -u +%Y-%m)" --body-file body.md \
            || gh pr edit "$branch" --body-file body.md
      - name: Report failed sources
        if: steps.s5.outcome == 'failure' || steps.s7.outcome == 'failure' || steps.s8.outcome == 'failure' || steps.s9.outcome == 'failure'
        run: |
          echo "S5 ${{ steps.s5.outcome }}, S7 ${{ steps.s7.outcome }}, S8 ${{ steps.s8.outcome }}, S9 ${{ steps.s9.outcome }}"
          exit 1
