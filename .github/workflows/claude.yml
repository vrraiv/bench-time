# Responds to "@claude" mentions in issues, PR comments and PR reviews.
#
# Repository setup needed once:
#   Settings > Secrets and variables > Actions > New repository secret:
#   CLAUDE_CODE_OAUTH_TOKEN  (from `claude setup-token`)
#
# The action only acts for users with write access to the repo. It has no network
# credentials for the court hosts (Tier 2/3 sources): the CLAUDE.md rules still apply,
# and this workflow never runs fetches or the data pipeline.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No web tools: Tier 3 sources must never be touched, and the pipeline is not run here.
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(uv run pytest:*),Bash(uv run ruff:*)"
            --disallowedTools "WebFetch,WebSearch"
